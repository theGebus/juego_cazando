<!DOCTYPE html>
<html>
<head>
  <title>Juego Cazando</title>

  <link rel="stylesheet"  href="cazando.css">
  <script src="utils.js"></script>

</head>
<body onload="iniciarJuego()">

  <h1>Juego Cazando</h1>
  <p>Autor: Diego Ortega "theGebus"</p>
  <canvas width="500" height="500" id="areaJuego"></canvas>

  <div class="controles">
    <button onclick="moverPersonajeArriba();">⬆</button>
    <br>
    <button onclick="moverPersonajeIzquierda();">⬅</button>
    <button onclick="moverPersonajeAbajo();">⬇</button>
    <button onclick="moverPersonajeDerecha();">➡</button>
    <p><button onclick="">Reiniciar</button></p>
  </div>


  <div class="panel">
    <span>Puntos: <span id="puntos">0</span></span>
    <span>Tiempo: <span id="tiempo">10</span></span>
  </div>

  <p id="mensaje"></p>

  <script src="cazando.js"></script>
</body>
</html>
